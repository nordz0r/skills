# SPDX-License-Identifier: Apache-2.0
# Pinned to NVIDIA SkillEvaluator 0.9.0 (official ci/bundles/0.9.0 template).
# The image uses the default OSS validation policy. No secrets or LLM keys.
name: Skill checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@ba7779ad617c6444c98b6241a75bce92067e9d56
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:e96e3aaad89bf78c4f3f8c621e88005d18bd7c485b29c0d7945864700e5944e6
      paths: |-
        administering-linux
        agency-database-optimizer
        agency-devops-automator
        agency-incident-response-commander
        agency-security-engineer
        agency-sre
        agency-technical-writer
        amnezia-vpn
        amneziawg-openwrt-guide
        ansible-playbook
        atlassian
        context-audit
        docker-ops
        elk-kibana-dashboards
        gitlab-ci
        linux-routing
        litellm-guide
        nextcloud-admin
        nextcloud-collectives
        open-terminal-guide
        open-webui-guide
        opencodex-guide
        podkop-openwrt-guide
        pr-lens-diagrams
        preview-interview
        telegram-formatting
        zapret-openwrt-guide
      min-score: 70
      # Report-only for the first catalog pass. Flip to `strict` to enforce
      # the quality threshold and fail the job on HIGH policy findings.
      enforcement-mode: advisory
      security-baselines: false
      scan-mode: all
      llm: false
