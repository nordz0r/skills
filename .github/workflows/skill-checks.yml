# SPDX-License-Identifier: Apache-2.0
# Pinned to NVIDIA SkillEvaluator 0.9.0 (image and action SHAs from
# ci/bundles/0.9.0/skill-checks.yml and evaluate-skills.yml@ba7779ad617c).
# The image uses the default OSS validation policy. No secrets or LLM keys.
#
# The official reusable workflow is not called. In 0.9.0 its credential
# preflight unions short redaction variants across the catalog; those
# variants can be a substring of a skill directory name (litellm-guide)
# or of report keys such as `passed` (open-webui-guide examples). The
# runner then publishes no usable scores. This workflow runs the same
# pinned image CLI on an explicit list of 27 root skills and redacts
# report values only. Skills in git are not modified.
name: Skill checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Flip to `strict` to enforce min-score 70 and fail the job on HIGH findings.
  ENFORCEMENT_MODE: advisory
  MIN_SCORE: "70"
  SCAN_WORKERS: "4"
  TIER1_IMAGE: ghcr.io/nvidia/skillevaluator-tier1@sha256:e96e3aaad89bf78c4f3f8c621e88005d18bd7c485b29c0d7945864700e5944e6
  SKILL_PATHS: |-
    administering-linux
    agency-database-optimizer
    agency-devops-automator
    agency-incident-response-commander
    agency-security-engineer
    agency-sre
    agency-technical-writer
    amnezia-vpn
    amneziawg-openwrt-guide
    ansible-playbook
    atlassian
    context-audit
    docker-ops
    elk-kibana-dashboards
    gitlab-ci
    linux-routing
    litellm-guide
    nextcloud-admin
    nextcloud-collectives
    open-terminal-guide
    open-webui-guide
    opencodex-guide
    podkop-openwrt-guide
    pr-lens-diagrams
    preview-interview
    telegram-formatting
    zapret-openwrt-guide

jobs:
  tier1:
    name: Tier 1 scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate enforcement mode
        run: |
          python3 -I - <<'PY'
          import os
          mode = os.environ["ENFORCEMENT_MODE"]
          if mode not in {"strict", "advisory"}:
              raise SystemExit("enforcement-mode must be strict or advisory")
          PY

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate the immutable image reference
        run: |
          python3 -I - <<'PY'
          import os, re
          if not re.fullmatch(r"ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}", os.environ["TIER1_IMAGE"]):
              raise SystemExit("image must be a published GHCR image pinned to its sha256 digest")
          PY

      - name: Pull the published image without registry credentials
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker-config"
          docker --config "$RUNNER_TEMP/anonymous-docker-config" pull "$TIER1_IMAGE"

      - name: Evaluate selected skills
        env:
          IMAGE: ${{ env.TIER1_IMAGE }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/skill-reports"
          docker run --rm --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=1g \
            --tmpfs /audit-tmp:rw,nosuid,noexec,mode=1777,size=1g --env TMPDIR=/audit-tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/skill-reports,dst=/reports" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/workflows/run-skillevaluator-tier1.py,dst=/run-skillevaluator-tier1.py,readonly" \
            --env SKILL_PATHS --env MIN_SCORE --env ENFORCEMENT_MODE --env SCAN_WORKERS \
            --env GITHUB_ACTIONS --env REPORT_RUN_URL --env REPORT_COMMIT \
            --entrypoint python3 \
            "$IMAGE" -I /run-skillevaluator-tier1.py

      - name: Add the result to the workflow summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/skill-reports/summary.md" ]; then
            cat "$RUNNER_TEMP/skill-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Tier 1 did not complete. Inspect the failed step above.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports even when validation fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-evaluator-tier1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload publisher evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-evaluator-tier1-evidence-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-reports/summary.json
            ${{ runner.temp }}/skill-reports/skill-*/skillevaluator-tier1.json
          if-no-files-found: warn
          retention-days: 14
