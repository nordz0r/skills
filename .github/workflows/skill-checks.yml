# SPDX-License-Identifier: Apache-2.0
# Pinned to NVIDIA SkillEvaluator 0.9.0 (official ci/bundles/0.9.0 template).
# The image uses the default OSS validation policy. No secrets or LLM keys.
name: Skill checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover skills
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      paths: ${{ steps.list.outputs.paths }}
    steps:
      # Same checkout pin as the reusable SkillEvaluator workflow.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: List skill directories
        id: list
        # Every tracked <dir>/SKILL.md becomes a scan path, so new skills are
        # scanned without editing this file.
        #
        # EXCLUDE_PREFIXES (one per line, matched as a path prefix):
        #   plugins/  - generated Codex bundle copies of the root skills
        #               (scripts/sync-codex-plugins.js); scanning them would
        #               only duplicate the root results.
        #
        # EXCLUDE_SKILLS (one per line, exact skill directory): skills where a
        # Tier 1 scanner does not finish in 0.9.0. An incomplete scan keeps
        # enforcement-mode advisory from downgrading the verdict, so the job
        # would fail regardless of findings. Re-check on each image bump.
        #   agency-security-engineer - skillspector incomplete
        #   atlassian                - pip-audit incomplete
        #   nextcloud-admin          - skillspector incomplete (analysis-evasion, partial)
        #   open-webui-guide         - skillspector incomplete (analysis-evasion, partial)
        #   pr-lens-diagrams         - skillspector and semgrep incomplete
        env:
          EXCLUDE_PREFIXES: |-
            plugins/
          EXCLUDE_SKILLS: |-
            agency-security-engineer
            atlassian
            nextcloud-admin
            open-webui-guide
            pr-lens-diagrams
        run: |
          set -euo pipefail
          paths=$(git ls-files -- '*/SKILL.md' | while IFS= read -r file; do
            dir=$(dirname -- "$file")
            skip=
            while IFS= read -r prefix; do
              if [ -n "$prefix" ] && [ "${file#"$prefix"}" != "$file" ]; then skip=1; fi
            done <<< "$EXCLUDE_PREFIXES"
            while IFS= read -r skill; do
              if [ -n "$skill" ] && [ "$dir" = "$skill" ]; then skip=1; fi
            done <<< "$EXCLUDE_SKILLS"
            if [ -z "$skip" ]; then printf '%s\n' "$dir"; fi
          done | sort -u)
          if [ -z "$paths" ]; then echo "No SKILL.md found" >&2; exit 1; fi
          printf 'Scanning %s skills\n' "$(printf '%s\n' "$paths" | wc -l)"
          {
            echo 'paths<<SKILL_PATHS_EOF'
            printf '%s\n' "$paths"
            echo 'SKILL_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"

  skills:
    needs: discover
    uses: NVIDIA/SkillEvaluator/.github/workflows/evaluate-skills.yml@ba7779ad617c6444c98b6241a75bce92067e9d56
    with:
      image: ghcr.io/nvidia/skillevaluator-tier1@sha256:e96e3aaad89bf78c4f3f8c621e88005d18bd7c485b29c0d7945864700e5944e6
      # Generated by the discover job (tracked */SKILL.md minus the exclusions).
      paths: ${{ needs.discover.outputs.paths }}
      min-score: 70
      # Report-only for the first catalog pass. Flip to `strict` to enforce
      # the quality threshold and fail the job on HIGH policy findings.
      enforcement-mode: advisory
      security-baselines: false
      scan-mode: all
      llm: false
